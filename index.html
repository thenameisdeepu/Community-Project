    <script>
      (function() {
        try {
          var saved = localStorage.getItem('neighbrly_theme');
          var isDark = saved ? saved === 'dark' : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#faf8ff] text-[#131b2e] antialiased selection:bg-[#dde1ff] selection:text-[#001453]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
